name = "replore"
pages_build_output_dir = "web"

# RS34a: Workers AI runs the relevance check first (no key); Groq (LLM_API_KEY) is the fallback. On the Workers Free plan it stops at the daily
# free allocation instead of billing; on Workers Paid, usage past the allocation is billed.
[ai]
binding = "AI"

# RS34d: to keep failure logs (codes and timings only), enable Workers Analytics Engine on the account first, then add:
# [[analytics_engine_datasets]]
# binding = "RELEVANCE_LOG"
# dataset = "replore_relevance_failures"
# (Adding it before Analytics Engine was enabled made the Pages deploy fail.)

# RS34e: preview builds only — models the live eval may compare (production has no EVAL_MODELS, so no override).
# Bindings don't inherit into an environment block, so the AI binding is repeated here.
[env.preview]
ai = { binding = "AI" }

[env.preview.vars]
EVAL_MODELS = "@cf/meta/llama-3.1-8b-instruct-fp8,@cf/meta/llama-3.1-8b-instruct-fast,@cf/meta/llama-3.2-3b-instruct,@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/meta/llama-4-scout-17b-16e-instruct,@cf/mistralai/mistral-small-3.1-24b-instruct,@cf/google/gemma-3-12b-it,@cf/zai-org/glm-4.7-flash"
