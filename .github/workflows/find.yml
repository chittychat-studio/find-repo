# Manual "Run workflow" search (RS13). GitHub search API only; no model, no secrets beyond the read-only Actions token.
name: find
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Search queries, separated by ; (max 4). Example: powerpoint generator; pptx generate; topic:pptx"
        required: true
        type: string
      license:
        description: "open = open-source licensed only; any = also unlicensed (flagged)"
        required: true
        default: open
        type: choice
        options: [open, any]
      max_age_months:
        description: "Skip repos with no push in this many months (0 = no limit)"
        required: true
        default: "24"
        type: string
      min_stars:
        description: "Skip repos with fewer stars than this (0 = no limit)"
        required: true
        default: "50"
        type: string
      rank:
        description: "fit = relevant+popular+free; balanced = each search's best match first; stars = pure star order"
        required: true
        default: fit
        type: choice
        options: [fit, balanced, stars]
      prefer_starters:
        description: "Put ready-made starter templates first"
        required: true
        default: false
        type: boolean
      csv:
        description: "Also show the results as CSV (copy into Excel / Google Sheets)"
        required: true
        default: false
        type: boolean
      all:
        description: "Show every suitable repo, not just the top 10 (for a PRD)"
        required: true
        default: false
        type: boolean
      group:
        description: "Group results by need/feature (one section per search)"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search GitHub
        env:
          QUERIES: ${{ inputs.queries }}
          LICENSE_MODE: ${{ inputs.license }}
          MAX_AGE: ${{ inputs.max_age_months }}
          MIN_STARS: ${{ inputs.min_stars }}
          RANK: ${{ inputs.rank }}
          PREFER_STARTERS: ${{ inputs.prefer_starters }}
          CSV: ${{ inputs.csv }}
          ALL: ${{ inputs.all }}
          GROUP: ${{ inputs.group }}
          GITHUB_TOKEN: ${{ github.token }}
        # RS19: explicit bash gives -o pipefail, so a script error fails the run instead of showing green.
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, "scripts")
          import scout
          queries = [q.strip() for q in os.environ["QUERIES"].split(";") if q.strip()]
          flags = ["--prefer-starters"] if os.environ["PREFER_STARTERS"] == "true" else []
          flags += ["--csv-block"] if os.environ["CSV"] == "true" else []
          flags += ["--all"] if os.environ["ALL"] == "true" else []
          flags += ["--group"] if os.environ["GROUP"] == "true" else []
          code = scout.main(["--markdown", "--license", os.environ["LICENSE_MODE"],
                             "--max-age-months", os.environ["MAX_AGE"], "--min-stars", os.environ["MIN_STARS"],
                             "--rank", os.environ["RANK"], *flags, "--", *queries])
          sys.exit(0 if code == 1 else code)  # RS19: no match is a result, not a failure
          PY
