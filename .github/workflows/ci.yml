# Unit tests only. No network calls, no secrets (RS11).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node tests/test_web_logic.js
      - run: python evals/run.py  # RS5: goal-based fit-ranking evals must pass
